build_image:
#    image: docker:git
    script:
        - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN registry.gitlab.com
        - docker build -f Dockerfile.Qa -t registry.gitlab.com/nechuhaev/menus/backend .
