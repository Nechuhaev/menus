name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/menus
            git pull origin main

            docker build -f Dockerfile.Production -t menus-web:latest --build-arg CERT_PASSWORD=${{ secrets.CERT_PASSWORD }} .
            docker stop menus-web && docker rm menus-web
            docker run -d --name menus-web --network menus_default -p 5001:5001 -e ASPNETCORE_ENVIRONMENT=Production -e ASPNETCORE_URLS=http://+:5001 menus-web:latest

            docker build -f Dockerfile.Files -t menus-files:latest .
            docker stop menus-files && docker rm menus-files
            docker run -d --name menus-files --network menus_default -p 127.0.0.1:5100:5100 -e ASPNETCORE_ENVIRONMENT=Production menus-files:latest

            docker build -f Dockerfile.Telegram -t menus-telegrambot:latest .
            docker stop menus-telegrambot && docker rm menus-telegrambot
            docker run -d --name menus-telegrambot --network menus_default -e ASPNETCORE_ENVIRONMENT=Production menus-telegrambot:latest

            docker image prune -f
