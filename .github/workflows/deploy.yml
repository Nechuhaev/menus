name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/menus
            git pull origin main
            test -f /root/menus.env || { echo "Немає /root/menus.env із секретами - деплой зупинено"; exit 1; }

            docker build -f Dockerfile.Production -t menus-web:latest --build-arg CERT_PASSWORD=${{ secrets.CERT_PASSWORD }} .
            docker rm -f menus-web || true
            docker run -d --restart unless-stopped --name menus-web --network menus_default -p 5001:5001 --env-file /root/menus.env -e ASPNETCORE_ENVIRONMENT=Production -e ASPNETCORE_URLS=http://+:5001 -v /root/menus/dataprotection-keys:/app/Keys menus-web:latest

            docker build -f Dockerfile.Files -t menus-files:latest .
            docker rm -f menus-files || true
            docker run -d --restart unless-stopped --name menus-files --network menus_default -p 127.0.0.1:5100:5100 -e ASPNETCORE_ENVIRONMENT=Production menus-files:latest

            docker build -f Dockerfile.Telegram -t menus-telegrambot:latest .
            docker rm -f menus-telegrambot || true
            docker run -d --restart unless-stopped --name menus-telegrambot --network menus_default --env-file /root/menus.env -e ASPNETCORE_ENVIRONMENT=Production menus-telegrambot:latest

            docker image prune -f
