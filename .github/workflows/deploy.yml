name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/menus
            git pull origin main
            test -f /root/menus.env || { echo "Немає /root/menus.env із секретами - деплой зупинено"; exit 1; }

            docker build -f Dockerfile.Production -t menus-web:latest --build-arg CERT_PASSWORD=${{ secrets.CERT_PASSWORD }} .
            # без простою, якщо увімкнено (ops/README-zero-downtime.md); інакше - як раніше
            bash ops/deploy-web.sh

            docker build -f Dockerfile.Files -t menus-files:latest .
            docker rm -f menus-files || true
            docker run -d --restart unless-stopped --name menus-files --network menus_default -p 127.0.0.1:5100:5100 --env-file /root/menus.env -e ASPNETCORE_ENVIRONMENT=Production menus-files:latest

            # Telegram-бот вимкнено (не використовувався); код лишається в Menus.TelegramBot
            docker rm -f menus-telegrambot || true

            docker image prune -f
