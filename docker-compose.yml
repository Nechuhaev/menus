version: '2'
services:
  mariadb:
    image: mariadb
    restart: unless-stopped
    # База ~1.9 ГБ: кеш InnoDB 2 ГБ, щоб дані читались з пам'яті (за замовчуванням 128 МБ - пошук 6-11 с).
    # Увага: дані зберігаються в анонімному томі контейнера - не перестворювати контейнер без бекапу.
    command: --innodb-buffer-pool-size=2G
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=menus
    ports:
      - '127.0.0.1:3306:3306'
  adminer:
    image: adminer
    ports:
      - '3333:8080'
  grafana-xxl:
    image: monitoringartist/grafana-xxl
    ports:
      - '3000:3000'
  postfix:
    image: gitlab.vvertigoo.pp.ua:1212/juzzzt-team/menus/postfix  # приватний registry, лишити для довідки
    environment:
      - maildomain=tipmymenu.com
      - 'smtp_user=${POSTFIX_SMTP_USER}'
    ports:
      - '25:25'
      - '25:25/udp'
    volumes:
      - 'E:\Temp\DKIM:/etc/opendkim/domainkeys'
